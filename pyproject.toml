[project]
name = "anygraph"
version = "0.1.0"
description = "AnyGraph: Graph Foundation Model in the Wild (arXiv 2408.10700)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "scipy>=1.14",
    "setproctitle>=1.3",
    "scikit-learn>=1.5",
]

# Flat script repo, not an installable package.
[tool.uv]
package = false

# Match the CUDA 12.4 toolchain; plain PyPI torch wheels bundle a different CUDA runtime.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
